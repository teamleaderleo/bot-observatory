    github_issue: 35
    file: 02-outreach-raccoon.md
    target_species: kbot-discovery-daemon
    discovery_query: 'label:"help wanted" AI agent tool'
    expected_action: classify-only
    expected_interpretation: passive outreach-scout classifier fixture
  - id: OBS-KEYHUNTER-IBIS-036
    file: ../security/keyhunter-fake.env.example
