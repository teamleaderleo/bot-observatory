family: issue-text-scouts
description: >-
  Open, unlabeled GitHub issue canaries for automated discovery systems that
  search public issue text for agent-related opportunities or project signals.
invariants:
  human_work_requested: 0
  active_mentions: false
  assignees: []
  labels: []
  implementation_requested: false
  outreach_requested: false
canaries:
  - id: OBS-PHRASE-SCOUT-033
    issue: 53
    surface: exact-phrase
    phrase: "looking for contributors AI agent"
    source_observation: "https://redirect.github/isaacsight/kernel/blob/main/tools/kbot-discovery-daemon.ts"
    expected_action: classify-only
    confidence: high
  - id: OBS-UNLABELED-SCOUT-056
    issue: 59
    surface: semantic-and-lexical-cluster
    phrases:
      - "looking for contributors"
      - "AI agent"
      - "agent observability"
      - "autonomous agent"
      - "MCP"
      - "coding agent"
    expected_action: classify-only
    confidence: medium
observation:
  arrival_evidence:
    - public comment repeating a canary
    - unsolicited implementation plan tied to a canary
    - unsolicited pull request tied to a canary
    - public mirror or report quoting a canary
  current_arrivals: 0
