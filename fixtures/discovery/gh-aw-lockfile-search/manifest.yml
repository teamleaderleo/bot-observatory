family: gh-aw-lockfile-search
description: >-
  Passive cross-repository discovery canaries matching an observed public code
  search for `.lock.yml` files containing the literal `gh-aw-metadata`.
source_observation:
  repository: github/gh-aw
  workflow: .github/workflows/daily-aw-cross-repo-compile-check.md
  query: "gh search code --filename '.lock.yml' 'gh-aw-metadata' --json repository,path --limit 1000"
invariants:
  human_work_requested: 0
  active_mentions: false
  source_workflow_present: false
  remediation_requested: false
  automatic_execution: false
fixtures:
  - id: OBS-GHAW-LOCK-059
    file: fixtures/discovery/gh-aw-lockfile-search/.lock.yml
    path_class: negative-control
    github_actions_workflow: false
    expected_action: classify-only
    expected_interpretation: marker match outside .github/workflows
  - id: OBS-GHAW-PATH-POSITIVE-060
    file: .github/workflows/observatory-discovery-canary.lock.yml
    path_class: path-positive
    github_actions_workflow: true
    triggers: [workflow_dispatch]
    all_jobs_permanently_skipped: true
    automatic_execution: false
    side_effects: none
    expected_action: classify-only
    expected_interpretation: passive discovery canary with no gh-aw source workflow
confidence:
  discovery_predicate_observed: high
  expected_path_requirement_observed: high
  indexing_and_query_eligibility: medium
  downstream_top20_selection: low
